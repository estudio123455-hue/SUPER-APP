name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  architecture-and-backend-tests:
    name: Architecture, Domain & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Contract-First OpenAPI Contract Sync
        run: |
          python backend/scripts/export_openapi.py
          git diff --exit-code shared-contracts/openapi.json || (echo "Error: shared-contracts/openapi.json is out of date. Run python backend/scripts/export_openapi.py." && exit 1)

      - name: Run Test Suite (Domain, Architecture & Integration)
        run: |
          pytest backend/tests -v

  docker-compose-validation:
    name: Docker Infrastructure & Multi-Schema Isolation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Syntax
        run: |
          docker compose config --quiet

      - name: Verify PostgreSQL Multi-Schema Isolation Script
        run: |
          test -f infra/postgres/init-schemas.sql
          grep -q "identity_schema" infra/postgres/init-schemas.sql
          grep -q "wallet_schema" infra/postgres/init-schemas.sql
          grep -q "commerce_schema" infra/postgres/init-schemas.sql
          grep -q "media_ai_schema" infra/postgres/init-schemas.sql
          echo "Verified all 4 isolated bounded context schemas in init-schemas.sql"
